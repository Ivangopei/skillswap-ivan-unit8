<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Swap</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- AI-generated: semantic homepage structure -->
  <header class="site-header">
    <h1 class="logo">Skill Swap</h1>
    <nav>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#skills">Browse Skills</a></li>
        <li><a href="#">Offer Skills</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Learn from your classmates. Teach what you know.</h2>
      <p>Skill Swap connects students who want to learn new skills with students who can teach them.</p>
      <a href="#skills" class="btn">Browse Skills</a>
    </section>

    <section id="skills" class="skills">
      <h2>Featured Skills</h2>

      <div class="filters">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Programming">Programming</button>
        <button class="filter-btn" data-category="Music">Music</button>
        <button class="filter-btn" data-category="Career">Career</button>
      </div>

      <div id="skills-grid" class="skills-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Skill Swap. Built by Ivan.</p>
  </footer>

  <script src="skillswap-functions.js"></script>
  <script src="script.js"></script>
</body>
</html>
